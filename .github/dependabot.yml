version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 30
    commit-message:
      prefix: 'chore(deps)'
    allow:
      - dependency-type: direct
    # The ai-sdk packages are intentionally on the beta channel. Semver sorts
    # "canary" above "beta", so without these rules Dependabot proposes canary
    # builds. Ranges end at the stable release so it still picks that up.
    ignore:
      - dependency-name: 'ai'
        versions: ['>=7.0.0-canary.0 <7.0.0']
      - dependency-name: '@ai-sdk/openai'
        versions: ['>=4.0.0-canary.0 <4.0.0']
      - dependency-name: '@ai-sdk/anthropic'
        versions: ['>=4.0.0-canary.0 <4.0.0']
      - dependency-name: '@ai-sdk/google'
        versions: ['>=4.0.0-canary.0 <4.0.0']
    groups:
      patch:
        update-types:
          - patch
      minor:
        update-types:
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 30
    commit-message:
      prefix: 'chore(deps)'
    groups:
      patch:
        update-types:
          - patch
      minor:
        update-types:
          - minor
